[package]
name = "tauri-plugin-keystore"
version = "2.1.0-takos.1"
authors = ["Takos"]
description = "Takos-owned secure seed storage for native OS credential stores"
edition = "2021"
rust-version = "1.89"
license = "AGPL-3.0-only"
publish = false
links = "tauri-plugin-keystore"

[dependencies]
serde = "1.0"
tauri = { version = "2.11.5", default-features = false }
thiserror = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native", "linux-native-sync-persistent", "windows-native"] }

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }
